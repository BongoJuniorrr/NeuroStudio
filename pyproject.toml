[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "neurostudio"
version = "0.0.1b1"
description = "Local visual ML studio: Python execution, browser interface"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_WEB_LICENSES.txt"]
readme = "README.md"
authors = [{name = "LAILA Technical Team"}]
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.5", "uvicorn==0.34.2", "python-multipart==0.0.20", "psutil==7.0.0"]

[project.urls]
Homepage = "http://laila.thvphuong.id.vn/"
Repository = "https://github.com/BongoJuniorrr/NeuroStudio"
Issues = "https://github.com/BongoJuniorrr/NeuroStudio/issues"

[project.optional-dependencies]
engine = ["numpy==2.2.6", "pandas==2.2.3", "scikit-learn==1.6.1", "pillow==11.2.1", "safetensors==0.5.3", "scipy==1.15.3", "joblib==1.5.1", "threadpoolctl==3.6.0"]
analysis = ["umap-learn==0.5.7", "numba==0.61.2", "llvmlite==0.44.0", "pynndescent==0.5.13", "tqdm==4.67.1"]
dev = ["pytest==8.3.5", "httpx==0.28.1", "build==1.2.2.post1", "ruff==0.11.10"]

[project.scripts]
neurostudio = "neurostudio.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neurostudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
